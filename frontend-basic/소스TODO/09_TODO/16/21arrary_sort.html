<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // prompt 로 10명의 학생이 점수를 입력하세요.  
        // data 변수에 그 정보를 담습니다. 
        // 정렬하여 출력하세요. 

        const data = [ 5, 2, 30,22, 90, 10, 39 , 11 ] 
        data.sort() ;  
        document.write( data );
        // 배열의 sort()함수는 문자열로 만들어 정렬. 즉 "5"가  "10"보다 크다.
        // 이 문제의 해결 방법은 sort() 에 비교 함수를 만들어서 제공 ㄴ

        data.sort( 
            function compare(a, b) {
                if(a > b) return 1;
                if(a < b) return -1;
                return 0;
        });
        
        document.write( data );

    </script>
</body>
</html>
