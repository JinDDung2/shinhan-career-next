<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Java this 키워드와 현재 객체</title>
  <desc id="desc">this.speed는 현재 객체의 인스턴스 변수이고 speed는 메서드 매개변수라는 차이</desc>
  <rect width="980" height="540" fill="#f7f9fc"/>
  <text x="490" y="54" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#172033">this는 현재 객체 자신</text>
  <text x="490" y="88" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#566174">이름이 같은 변수 중 어느 것을 말하는지 구분한다</text>
  <rect x="75" y="135" width="360" height="285" rx="8" fill="#ffffff" stroke="#c9d3e5" stroke-width="2"/>
  <text x="255" y="177" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1e3a8a">myCar 객체</text>
  <rect x="135" y="225" width="240" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="254" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" fill="#1e3a8a">this.speed</text>
  <text x="255" y="278" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#1e3a8a">인스턴스 변수</text>
  <text x="255" y="350" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#566174">현재 메서드를 실행 중인 객체</text>
  <rect x="545" y="135" width="360" height="285" rx="8" fill="#ffffff" stroke="#c9d3e5" stroke-width="2"/>
  <text x="725" y="177" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#7c2d12">setSpeed(int speed)</text>
  <rect x="605" y="225" width="240" height="70" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="725" y="254" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7c2d12">speed</text>
  <text x="725" y="278" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#7c2d12">매개변수, 지역 변수</text>
  <text x="725" y="350" text-anchor="middle" font-family="Arial, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#566174">메서드가 호출될 때 들어온 값</text>
  <path d="M610 260 C540 260 510 260 440 260" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="345" y="445" width="290" height="48" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="490" y="476" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#312e81">this.speed = speed;</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
