<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Java serialization with object streams</title>
  <desc id="desc">Diagram showing Java object serialization and deserialization using ObjectOutputStream and ObjectInputStream.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">객체 직렬화와 역직렬화</text>
  <text x="40" y="86" font-family="Arial, sans-serif" font-size="16" fill="#475569">메모리의 객체를 파일에 저장 가능한 바이트 흐름으로 바꾸고 다시 읽어온다.</text>

  <rect x="55" y="155" width="220" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="195" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#14532d">Person</text>
  <text x="92" y="234" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">name = "kim"</text>
  <text x="92" y="261" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">age = 20</text>

  <line x1="285" y1="225" x2="430" y2="225" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="305" y="204" font-family="Arial, sans-serif" font-size="15" fill="#334155">writeObject()</text>

  <rect x="440" y="155" width="170" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="472" y="195" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">person.dat</text>
  <text x="474" y="235" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">byte stream</text>
  <text x="486" y="262" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">file data</text>

  <line x1="620" y1="225" x2="765" y2="225" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="641" y="204" font-family="Arial, sans-serif" font-size="15" fill="#334155">readObject()</text>

  <rect x="775" y="155" width="150" height="140" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="803" y="195" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#92400e">Object</text>
  <text x="800" y="234" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">다운캐스팅</text>
  <text x="808" y="261" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Person</text>

  <rect x="220" y="345" width="540" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="252" y="372" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Serializable은 이 객체를 직렬화해도 된다는 표시 역할을 한다.</text>
</svg>
