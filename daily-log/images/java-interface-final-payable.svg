<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Java interface and final method with Payable</title>
  <desc id="desc">Diagram showing a Payable interface implemented by Employee with a final printCompany method.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">인터페이스와 final 메서드</text>
  <text x="40" y="86" font-family="Arial, sans-serif" font-size="16" fill="#475569">인터페이스는 구현할 규칙을 정하고, final 메서드는 자식이 바꾸지 못하게 막는다.</text>

  <rect x="70" y="135" width="285" height="190" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="113" y="174" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#075985">interface Payable</text>
  <rect x="103" y="210" width="220" height="78" rx="6" fill="#ffffff" stroke="#38bdf8"/>
  <text x="125" y="240" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">TAX_RATE = 0.1</text>
  <text x="125" y="266" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">calculatePay()</text>

  <line x1="365" y1="230" x2="535" y2="230" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="408" y="213" font-family="Arial, sans-serif" font-size="15" fill="#334155">implements</text>

  <rect x="545" y="120" width="350" height="220" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="642" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d">Employee</text>
  <rect x="585" y="195" width="270" height="95" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="610" y="225" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">baseSalary</text>
  <text x="610" y="251" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">calculatePay(): 세후 급여</text>
  <text x="610" y="277" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">final printCompany()</text>

  <rect x="283" y="358" width="415" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="310" y="385" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Payable[] 배열은 Employee를 급여 계산 규칙으로 바라본다.</text>
</svg>
