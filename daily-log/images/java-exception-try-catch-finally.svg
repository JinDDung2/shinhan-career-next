<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Java try catch finally exception flow</title>
  <desc id="desc">Diagram showing try, catch, and finally blocks in Java exception handling.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">try-catch-finally 흐름</text>
  <text x="40" y="86" font-family="Arial, sans-serif" font-size="16" fill="#475569">문제가 생길 수 있는 코드는 try, 처리 코드는 catch, 마지막 정리는 finally에 둔다.</text>

  <rect x="70" y="145" width="220" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="158" y="185" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">try</text>
  <text x="103" y="225" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">account.withdrawal()</text>
  <text x="118" y="252" font-family="Arial, sans-serif" font-size="15" fill="#334155">예외 발생 가능 코드</text>

  <line x1="300" y1="215" x2="430" y2="215" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="440" y="145" width="220" height="140" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="185" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d">catch</text>
  <text x="475" y="225" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">예외 메시지 출력</text>
  <text x="491" y="252" font-family="Arial, sans-serif" font-size="15" fill="#334155">문제 상황 처리</text>

  <line x1="670" y1="215" x2="800" y2="215" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="810" y="145" width="120" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="827" y="185" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d">finally</text>
  <text x="829" y="225" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">거래 종료</text>
  <text x="829" y="252" font-family="Arial, sans-serif" font-size="15" fill="#334155">항상 실행</text>

  <path d="M180 295 C180 350, 845 350, 870 295" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="382" y="374" font-family="Arial, sans-serif" font-size="16" fill="#475569">예외가 없어도 finally는 실행된다.</text>
</svg>
