<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Java thread lifecycle with start run and join</title>
  <desc id="desc">Diagram showing main thread creating worker threads with start, running run methods, and waiting with join.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Thread 실행 흐름</text>
  <text x="40" y="86" font-family="Arial, sans-serif" font-size="16" fill="#475569">start()는 새 실행 흐름을 만들고, join()은 작업이 끝날 때까지 기다린다.</text>

  <rect x="55" y="150" width="180" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="187" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">main thread</text>
  <text x="88" y="216" font-family="Arial, sans-serif" font-size="15" fill="#334155">Thread 객체 생성</text>

  <line x1="245" y1="194" x2="320" y2="194" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="260" y="176" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">start()</text>

  <rect x="330" y="105" width="190" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="374" y="139" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">worker A</text>
  <text x="382" y="166" font-family="Arial, sans-serif" font-size="15" fill="#334155">run() 실행</text>

  <rect x="330" y="220" width="190" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="374" y="254" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">worker B</text>
  <text x="382" y="281" font-family="Arial, sans-serif" font-size="15" fill="#334155">run() 실행</text>

  <line x1="530" y1="145" x2="625" y2="190" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="530" y1="260" x2="625" y2="210" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="635" y="150" width="150" height="88" rx="8" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
  <text x="685" y="187" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#86198f">join()</text>
  <text x="667" y="216" font-family="Arial, sans-serif" font-size="15" fill="#334155">완료 대기</text>

  <line x1="795" y1="194" x2="865" y2="194" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="875" y="150" width="70" height="88" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="891" y="187" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">결과</text>
  <text x="894" y="216" font-family="Arial, sans-serif" font-size="15" fill="#334155">출력</text>

  <rect x="205" y="340" width="570" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="234" y="367" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">run()을 직접 호출하면 새 스레드가 아니라 현재 스레드에서 일반 메서드처럼 실행된다.</text>
</svg>
