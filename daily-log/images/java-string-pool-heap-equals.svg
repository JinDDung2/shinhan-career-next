<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Java String Pool Heap and equals comparison</title>
  <desc id="desc">Diagram comparing string literals in String Pool and new String objects in Heap, explaining equality with == and equals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">String 비교: 위치와 내용은 다르다</text>
  <text x="40" y="86" font-family="Arial, sans-serif" font-size="16" fill="#475569">==는 같은 객체인지 보고, equals()는 문자열 내용이 같은지 본다.</text>

  <rect x="65" y="135" width="250" height="220" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#075985">String Pool</text>
  <rect x="105" y="215" width="170" height="70" rx="6" fill="#ffffff" stroke="#38bdf8"/>
  <text x="154" y="256" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">"aaa"</text>

  <rect x="665" y="135" width="250" height="220" rx="8" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
  <text x="755" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#86198f">Heap</text>
  <rect x="705" y="215" width="170" height="70" rx="6" fill="#ffffff" stroke="#e879f9"/>
  <text x="754" y="256" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">"aaa"</text>

  <text x="395" y="150" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">String a = "aaa";</text>
  <line x1="455" y1="165" x2="278" y2="225" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="395" y="215" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">String c = "aaa";</text>
  <line x1="455" y1="225" x2="278" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="370" y="285" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">String b = new String("aaa");</text>
  <line x1="560" y1="275" x2="703" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="285" y="365" width="410" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="310" y="392" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">a == b : false / a.equals(b) : true</text>
</svg>
