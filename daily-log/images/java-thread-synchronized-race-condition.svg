<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Java synchronized and race condition</title>
  <desc id="desc">Diagram comparing unsynchronized increments with synchronized access to shared data.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">공유 자원과 synchronized</text>
  <text x="40" y="86" font-family="Arial, sans-serif" font-size="16" fill="#475569">같은 값을 여러 스레드가 동시에 바꾸면 경쟁 상태가 생긴다.</text>

  <text x="80" y="132" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">동기화 없음</text>
  <rect x="55" y="155" width="155" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="92" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d">Thread A</text>
  <text x="87" y="209" font-family="Arial, sans-serif" font-size="14" fill="#334155">i++ 실행</text>

  <rect x="55" y="250" width="155" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="92" y="280" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d">Thread B</text>
  <text x="87" y="304" font-family="Arial, sans-serif" font-size="14" fill="#334155">i++ 실행</text>

  <line x1="220" y1="191" x2="335" y2="218" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="220" y1="286" x2="335" y2="244" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="345" y="190" width="170" height="86" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="384" y="226" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">공유 변수 i</text>
  <text x="375" y="254" font-family="Arial, sans-serif" font-size="14" fill="#334155">읽기-계산-쓰기 충돌</text>

  <text x="612" y="132" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">동기화 적용</text>
  <rect x="575" y="155" width="155" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="612" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">Thread A</text>
  <text x="603" y="209" font-family="Arial, sans-serif" font-size="14" fill="#334155">먼저 진입</text>

  <rect x="575" y="250" width="155" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="612" y="280" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">Thread B</text>
  <text x="611" y="304" font-family="Arial, sans-serif" font-size="14" fill="#334155">대기 후 진입</text>

  <line x1="740" y1="191" x2="835" y2="218" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="740" y1="286" x2="835" y2="244" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="845" y="190" width="90" height="86" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="866" y="226" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">lock</text>
  <text x="863" y="254" font-family="Arial, sans-serif" font-size="14" fill="#334155">순서 보장</text>

  <rect x="230" y="355" width="520" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="257" y="382" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">synchronized는 같은 객체의 임계 영역에 한 번에 하나의 스레드만 들어오게 한다.</text>
</svg>
