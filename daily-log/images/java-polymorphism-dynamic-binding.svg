<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
  <title id="title">Java polymorphism and dynamic binding</title>
  <desc id="desc">Diagram showing Shape references pointing to Circle and Rectangle objects, and runtime dispatch calling each object's area method.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="440" fill="#f8fafc"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">다형성과 동적 바인딩</text>
  <text x="40" y="86" font-family="Arial, sans-serif" font-size="16" fill="#475569">변수 타입은 Shape이지만, area()는 실행 시점의 실제 객체 기준으로 호출된다.</text>

  <rect x="60" y="135" width="240" height="230" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="105" y="172" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#075985">Shape[] shapes</text>
  <rect x="95" y="205" width="170" height="38" rx="6" fill="#ffffff" stroke="#38bdf8"/>
  <text x="126" y="230" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Shape shape</text>
  <rect x="95" y="258" width="170" height="38" rx="6" fill="#ffffff" stroke="#38bdf8"/>
  <text x="126" y="283" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Shape shape</text>
  <rect x="95" y="311" width="170" height="38" rx="6" fill="#ffffff" stroke="#38bdf8"/>
  <text x="126" y="336" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Shape shape</text>

  <line x1="270" y1="224" x2="435" y2="185" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="270" y1="277" x2="435" y2="277" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="270" y1="330" x2="435" y2="363" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="445" y="135" width="220" height="95" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">Circle</text>
  <text x="485" y="202" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">area(): r * r * PI</text>

  <rect x="445" y="250" width="220" height="95" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="482" y="285" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#92400e">Rectangle</text>
  <text x="493" y="317" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">area(): w * h</text>

  <rect x="445" y="365" width="220" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="399" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">Circle</text>

  <line x1="675" y1="183" x2="820" y2="183" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="675" y1="297" x2="820" y2="297" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="830" y="155" width="110" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="852" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">실행 결과</text>
  <text x="854" y="235" font-family="Arial, sans-serif" font-size="15" fill="#166534">Circle.area()</text>
  <text x="840" y="270" font-family="Arial, sans-serif" font-size="15" fill="#92400e">Rectangle.area()</text>
  <text x="854" y="305" font-family="Arial, sans-serif" font-size="15" fill="#166534">Circle.area()</text>
</svg>
